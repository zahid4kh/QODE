name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev \
            libqt6svg6-dev zlib1g-dev libgl1-mesa-dev dpkg-dev fakeroot patchelf file

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^VERSION *= *//p' QODE.pro | head -n1)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $version in QODE.pro" >&2
            exit 1
          fi

      - name: Compile (compile.sh)
        run: ./compile.sh

      - name: Debian package (system Qt)
        run: ./build-deb.sh

      - name: Debian package (bundled Qt)
        run: ./build-deb-qt.sh

      - name: Inspect packages
        run: |
          for f in *.deb; do
            echo "== $f"; dpkg-deb -I "$f" | sed -n '/Package:/p;/Version:/p;/Depends:/p'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: "*.deb"
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debs
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          generate_release_notes: true
